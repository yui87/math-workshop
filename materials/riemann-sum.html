<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>積分―区分求積法</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:22px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f8fafc;color:#172033}.app{max-width:1040px;margin:auto;background:#fff;border:1px solid #dbe3ee;border-radius:18px;padding:20px;box-shadow:0 12px 30px rgba(15,23,42,.07)}h1{margin:0 0 8px;font-size:clamp(22px,3vw,30px)}p{line-height:1.7}.controls{display:grid;grid-template-columns:1fr 220px;gap:14px;align-items:end;padding:14px;background:#f1f5f9;border-radius:14px;margin:16px 0}.control label{display:flex;justify-content:space-between;font-weight:700}.control input,.control select{width:100%;margin-top:8px}.control select{padding:9px;border:1px solid #cbd5e1;border-radius:9px;background:white}canvas{display:block;width:100%;height:auto;border:1px solid #dbe3ee;border-radius:14px;background:#fff}.readout{margin-top:12px;padding:12px 14px;border-radius:12px;background:#eff6ff;line-height:1.75}.bar{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden;margin-top:8px}.bar span{display:block;height:100%;background:#2563eb;width:0}.note{color:#64748b;font-size:13px}@media(max-width:700px){body{padding:10px}.app{padding:13px}.controls{grid-template-columns:1fr}}
</style></head><body><div class="app"><h1>区分求積法―長方形を細かくすると面積へ近づく</h1><p>関数 <b>f(x)=4−x²</b> の、0≦x≦2における曲線下の面積を長方形で近似します。分割数nを増やすと、長方形の隙間やはみ出しが小さくなります。</p><div class="controls"><div class="control"><label>分割数 n <span id="nText">8</span></label><input id="n" type="range" min="2" max="100" step="1" value="8"></div><div class="control"><label>高さを決める点</label><select id="method"><option value="left">左端</option><option value="right">右端</option><option value="mid" selected>中点</option></select></div></div><canvas id="cv" width="1000" height="540"></canvas><div class="readout" id="readout"></div><div class="bar"><span id="accuracy"></span></div><div class="note">青い長方形の面積の合計がリーマン和です。真の値は ∫₀²(4−x²)dx = 16/3 ≈ 5.3333 です。</div></div>
<script>
const nSlider=document.getElementById("n"),nText=document.getElementById("nText"),method=document.getElementById("method"),cv=document.getElementById("cv"),ctx=cv.getContext("2d"),readout=document.getElementById("readout"),accuracy=document.getElementById("accuracy");const f=x=>4-x*x,exact=16/3;
function draw(){const n=+nSlider.value,W=cv.width,H=cv.height,L=60,R=25,T=25,B=48,x0=-.3,x1=2.35,y0=-.4,y1=4.6,X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(y1-y)/(y1-y0)*(H-T-B),dx=2/n;nText.textContent=n;ctx.clearRect(0,0,W,H);ctx.strokeStyle="#dbe3ee";ctx.lineWidth=1;for(let x=0;x<=2.001;x+=.25){ctx.beginPath();ctx.moveTo(X(x),T);ctx.lineTo(X(x),H-B);ctx.stroke()}for(let y=0;y<=4;y+=.5){ctx.beginPath();ctx.moveTo(L,Y(y));ctx.lineTo(W-R,Y(y));ctx.stroke()}ctx.strokeStyle="#475569";ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(L,Y(0));ctx.lineTo(W-R,Y(0));ctx.stroke();ctx.beginPath();ctx.moveTo(X(0),T);ctx.lineTo(X(0),H-B);ctx.stroke();
let sum=0;for(let i=0;i<n;i++){let left=i*dx,right=(i+1)*dx,sample=method.value==="left"?left:method.value==="right"?right:(left+right)/2,height=Math.max(0,f(sample));sum+=height*dx;ctx.fillStyle="rgba(37,99,235,.22)";ctx.strokeStyle="rgba(37,99,235,.85)";ctx.lineWidth=1;const rx=X(left),rw=X(right)-X(left),ry=Y(height),rh=Y(0)-Y(height);ctx.fillRect(rx,ry,rw,rh);ctx.strokeRect(rx,ry,rw,rh)}ctx.strokeStyle="#dc2626";ctx.lineWidth=4;ctx.beginPath();for(let p=0;p<=700;p++){let x=0+2*p/700,y=f(x);if(p===0)ctx.moveTo(X(x),Y(y));else ctx.lineTo(X(x),Y(y))}ctx.stroke();ctx.fillStyle="#172033";ctx.font="bold 15px sans-serif";ctx.fillText("y=4−x²",X(.75),Y(f(.75))-14);const err=Math.abs(sum-exact),pct=Math.max(0,100*(1-err/exact));accuracy.style.width=pct.toFixed(1)+"%";const label={left:"左端",right:"右端",mid:"中点"}[method.value];readout.innerHTML="<b>"+label+"リーマン和</b>："+sum.toFixed(6)+"<br>真の面積："+exact.toFixed(6)+"　誤差：<b>"+err.toFixed(6)+"</b><br>nを増やすほど、各長方形の幅 Δx="+dx.toFixed(4)+" が小さくなり、曲線とのずれが細かく分散して面積に近づきます。"}
nSlider.addEventListener("input",draw);method.addEventListener("change",draw);draw();
</script></body></html>
