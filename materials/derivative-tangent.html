<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>微分―接線の傾きと導関数</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:22px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f8fafc;color:#172033}.app{max-width:1180px;margin:auto;background:#fff;border:1px solid #dbe3ee;border-radius:18px;padding:20px;box-shadow:0 12px 30px rgba(15,23,42,.07)}h1{margin:0 0 8px;font-size:clamp(22px,3vw,30px)}p{line-height:1.7}.controls{padding:14px;background:#f1f5f9;border-radius:14px;margin:16px 0}.controls label{display:flex;justify-content:space-between;font-weight:700}.controls input{width:100%;margin-top:8px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.buttons button{padding:8px 12px;border:0;border-radius:9px;background:#2563eb;color:white;font-weight:700;cursor:pointer}.layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{border:1px solid #dbe3ee;border-radius:14px;padding:10px}canvas{display:block;width:100%;height:auto}.readout{margin-top:12px;padding:12px 14px;border-radius:12px;background:#eff6ff;line-height:1.75}.note{color:#64748b;font-size:13px}@media(max-width:850px){.layout{grid-template-columns:1fr}}@media(max-width:600px){body{padding:10px}.app{padding:13px}}
</style></head><body><div class="app"><h1>接線の傾きを集めると、導関数になる</h1><p>関数 <b>f(x)=0.12x³−1.2x</b> 上の点を動かし、その点での接線の傾きを右のグラフへ記録します。傾きの変化そのものを関数として見るのが導関数です。</p><div class="controls"><label>接点のx座標 a <span id="xText">0.00</span></label><input id="xSlider" type="range" min="-4" max="4" step="0.05" value="0"><div class="buttons"><button id="clearBtn">軌跡を消す</button><button id="revealBtn">導関数を確認</button><button id="scanBtn">全体をなぞる</button></div></div><div class="layout"><div class="panel"><canvas id="main" width="620" height="480"></canvas><div class="note">青：元の関数　橙：接線</div></div><div class="panel"><canvas id="deriv" width="620" height="480"></canvas><div class="note">紫の点：これまでに調べた「xと接線の傾き」の組</div></div></div><div class="readout" id="readout"></div></div>
<script>
const slider=document.getElementById("xSlider"),xText=document.getElementById("xText"),main=document.getElementById("main"),mc=main.getContext("2d"),deriv=document.getElementById("deriv"),dc=deriv.getContext("2d"),readout=document.getElementById("readout"),revealBtn=document.getElementById("revealBtn");const seen=new Map();let reveal=false,scanTimer=null;const f=x=>.12*x*x*x-1.2*x,df=x=>.36*x*x-1.2;
function axes(c,W,H,x0,x1,y0,y1){const L=48,R=18,T=22,B=38,X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(y1-y)/(y1-y0)*(H-T-B);c.strokeStyle="#dbe3ee";c.lineWidth=1;for(let x=Math.ceil(x0);x<=x1;x++){c.beginPath();c.moveTo(X(x),T);c.lineTo(X(x),H-B);c.stroke();c.fillStyle="#64748b";c.font="12px sans-serif";c.fillText(x,X(x)-4,H-15)}for(let y=Math.ceil(y0);y<=y1;y++){c.beginPath();c.moveTo(L,Y(y));c.lineTo(W-R,Y(y));c.stroke()}c.strokeStyle="#475569";c.lineWidth=2;c.beginPath();c.moveTo(L,Y(0));c.lineTo(W-R,Y(0));c.stroke();c.beginPath();c.moveTo(X(0),T);c.lineTo(X(0),H-B);c.stroke();return{X,Y,L,R,T,B}}
function drawMain(a){const W=main.width,H=main.height,x0=-4.5,x1=4.5,y0=-5.5,y1=5.5;mc.clearRect(0,0,W,H);const p=axes(mc,W,H,x0,x1,y0,y1);mc.strokeStyle="#2563eb";mc.lineWidth=4;mc.beginPath();for(let i=0;i<=700;i++){let x=x0+(x1-x0)*i/700,y=f(x);if(i===0)mc.moveTo(p.X(x),p.Y(y));else mc.lineTo(p.X(x),p.Y(y))}mc.stroke();const m=df(a),ya=f(a);mc.strokeStyle="#f59e0b";mc.lineWidth=3;mc.beginPath();mc.moveTo(p.X(x0),p.Y(ya+m*(x0-a)));mc.lineTo(p.X(x1),p.Y(ya+m*(x1-a)));mc.stroke();mc.fillStyle="#7c3aed";mc.beginPath();mc.arc(p.X(a),p.Y(ya),8,0,Math.PI*2);mc.fill();mc.fillStyle="#172033";mc.font="bold 15px sans-serif";mc.fillText("P("+a.toFixed(2)+", "+ya.toFixed(2)+")",p.X(a)+10,p.Y(ya)-10)}
function drawDeriv(a){const W=deriv.width,H=deriv.height,x0=-4.5,x1=4.5,y0=-1.8,y1=5.8;dc.clearRect(0,0,W,H);const p=axes(dc,W,H,x0,x1,y0,y1);if(reveal){dc.strokeStyle="rgba(37,99,235,.45)";dc.lineWidth=3;dc.beginPath();for(let i=0;i<=700;i++){let x=x0+(x1-x0)*i/700,y=df(x);if(i===0)dc.moveTo(p.X(x),p.Y(y));else dc.lineTo(p.X(x),p.Y(y))}dc.stroke()}seen.forEach((y,x)=>{dc.fillStyle="#7c3aed";dc.beginPath();dc.arc(p.X(x),p.Y(y),4,0,Math.PI*2);dc.fill()});dc.fillStyle="#dc2626";dc.beginPath();dc.arc(p.X(a),p.Y(df(a)),8,0,Math.PI*2);dc.fill();dc.fillStyle="#172033";dc.font="bold 15px sans-serif";dc.fillText("("+a.toFixed(2)+", "+df(a).toFixed(2)+")",p.X(a)+9,p.Y(df(a))-10)}
function update(){const a=+slider.value,m=df(a);xText.textContent=a.toFixed(2);seen.set(Number(a.toFixed(2)),m);drawMain(a);drawDeriv(a);readout.innerHTML="x="+a.toFixed(2)+" における接線の傾きは <b>"+m.toFixed(3)+"</b> です。右側では、この値を点 <b>("+a.toFixed(2)+", "+m.toFixed(3)+")</b> として記録しています。点を動かすほど、導関数の形が浮かび上がります。"}
slider.addEventListener("input",update);document.getElementById("clearBtn").addEventListener("click",()=>{seen.clear();update()});revealBtn.addEventListener("click",()=>{reveal=!reveal;revealBtn.textContent=reveal?"導関数を隠す":"導関数を確認";update()});document.getElementById("scanBtn").addEventListener("click",()=>{clearInterval(scanTimer);let v=-4;scanTimer=setInterval(()=>{slider.value=v.toFixed(2);update();v+=.1;if(v>4.001)clearInterval(scanTimer)},24)});update();
</script></body></html>
