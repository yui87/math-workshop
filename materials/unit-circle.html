<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>三角関数―単位円と一般角</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:22px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f8fafc;color:#172033}.app{max-width:1180px;margin:auto;background:#fff;border:1px solid #dbe3ee;border-radius:18px;padding:20px;box-shadow:0 12px 30px rgba(15,23,42,.07)}h1{margin:0 0 8px;font-size:clamp(22px,3vw,30px)}p{line-height:1.7}.controls{padding:14px;background:#f1f5f9;border-radius:14px;margin:16px 0}.controls label{display:flex;justify-content:space-between;font-weight:700}.controls input{width:100%;margin-top:8px}.preset{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.preset button{padding:8px 11px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.layout{display:grid;grid-template-columns:minmax(360px,.9fr) minmax(460px,1.25fr);gap:16px}.panel{border:1px solid #dbe3ee;border-radius:14px;padding:10px;background:#fff}canvas{display:block;width:100%;height:auto}.readout{margin-top:12px;padding:12px 14px;border-radius:12px;background:#eff6ff;line-height:1.8}.value-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}.value{padding:9px;border-radius:9px;background:#fff;border:1px solid #bfdbfe;font-weight:750}.sin{color:#dc2626}.cos{color:#2563eb}.tan{color:#7c3aed}.hint{font-size:13px;color:#64748b}@media(max-width:900px){.layout{grid-template-columns:1fr}}@media(max-width:600px){body{padding:10px}.app{padding:13px}.panel{padding:4px}.value-grid{grid-template-columns:1fr}}
</style></head>
<body><div class="app"><h1>三角関数は「単位円上の点の座標」</h1><p>直角三角形で定義した三角比を、一般角へ拡張します。単位円上の点Pの <b class="cos">x座標がcosθ</b>、<b class="sin">y座標がsinθ</b> です。</p><div class="controls"><label>一般角 θ <span id="angleText">30°</span></label><input id="angle" type="range" min="-360" max="720" step="1" value="30"><div class="preset"><button data-a="0">0°</button><button data-a="30">30°</button><button data-a="45">45°</button><button data-a="60">60°</button><button data-a="90">90°</button><button data-a="180">180°</button><button data-a="270">270°</button><button data-a="360">360°</button></div><div class="hint">円上をドラッグして角度を変えることもできます。代表角では厳密値を併記します。</div></div><div class="layout"><div class="panel"><canvas id="circle" width="520" height="520"></canvas></div><div class="panel"><canvas id="graph" width="700" height="520"></canvas></div></div><div class="readout" id="readout"></div></div>
<script>
"use strict";
const angle=document.getElementById("angle"),angleText=document.getElementById("angleText"),circle=document.getElementById("circle"),cc=circle.getContext("2d"),graph=document.getElementById("graph"),gc=graph.getContext("2d"),readout=document.getElementById("readout");
const exactTable={
0:{sin:"0",cos:"1",tan:"0"},30:{sin:"1/2",cos:"√3/2",tan:"1/√3（= √3/3）"},45:{sin:"√2/2",cos:"√2/2",tan:"1"},60:{sin:"√3/2",cos:"1/2",tan:"√3"},90:{sin:"1",cos:"0",tan:"定義できません"},
120:{sin:"√3/2",cos:"−1/2",tan:"−√3"},135:{sin:"√2/2",cos:"−√2/2",tan:"−1"},150:{sin:"1/2",cos:"−√3/2",tan:"−1/√3（= −√3/3）"},180:{sin:"0",cos:"−1",tan:"0"},
210:{sin:"−1/2",cos:"−√3/2",tan:"1/√3（= √3/3）"},225:{sin:"−√2/2",cos:"−√2/2",tan:"1"},240:{sin:"−√3/2",cos:"−1/2",tan:"√3"},270:{sin:"−1",cos:"0",tan:"定義できません"},
300:{sin:"−√3/2",cos:"1/2",tan:"−√3"},315:{sin:"−√2/2",cos:"√2/2",tan:"−1"},330:{sin:"−1/2",cos:"√3/2",tan:"−1/√3（= −√3/3）"}
};
function fmt(v){return Math.abs(v)<.0005?"0":v.toFixed(3)}
function normalize(d){const n=((d%360)+360)%360;return Math.abs(n-360)<1e-9?0:n}
function display(value,exact){return exact===undefined?fmt(value):fmt(value)+" （= "+exact+"）"}
function drawCircle(deg){const W=circle.width,H=circle.height,cx=W/2,cy=H/2,R=190,rad=deg*Math.PI/180,px=cx+R*Math.cos(rad),py=cy-R*Math.sin(rad);cc.clearRect(0,0,W,H);cc.strokeStyle="#dbe3ee";cc.lineWidth=1;for(let k=-1;k<=1;k+=.5){cc.beginPath();cc.moveTo(cx-R,cy-k*R);cc.lineTo(cx+R,cy-k*R);cc.stroke();cc.beginPath();cc.moveTo(cx+k*R,cy-R);cc.lineTo(cx+k*R,cy+R);cc.stroke()}cc.strokeStyle="#475569";cc.lineWidth=2.2;cc.beginPath();cc.moveTo(35,cy);cc.lineTo(W-35,cy);cc.stroke();cc.beginPath();cc.moveTo(cx,35);cc.lineTo(cx,H-35);cc.stroke();cc.strokeStyle="#172033";cc.lineWidth=3;cc.beginPath();cc.arc(cx,cy,R,0,Math.PI*2);cc.stroke();
cc.strokeStyle="#64748b";cc.lineWidth=2;cc.setLineDash([7,6]);cc.beginPath();cc.moveTo(px,py);cc.lineTo(px,cy);cc.stroke();cc.beginPath();cc.moveTo(px,py);cc.lineTo(cx,py);cc.stroke();cc.setLineDash([]);cc.strokeStyle="#7c3aed";cc.lineWidth=3;cc.beginPath();cc.moveTo(cx,cy);cc.lineTo(px,py);cc.stroke();cc.strokeStyle="#2563eb";cc.lineWidth=7;cc.beginPath();cc.moveTo(cx,cy);cc.lineTo(px,cy);cc.stroke();cc.strokeStyle="#dc2626";cc.beginPath();cc.moveTo(px,cy);cc.lineTo(px,py);cc.stroke();cc.fillStyle="#7c3aed";cc.beginPath();cc.arc(px,py,8,0,Math.PI*2);cc.fill();
const norm=normalize(deg);cc.strokeStyle="#f59e0b";cc.lineWidth=3;cc.beginPath();cc.arc(cx,cy,55,0,-norm*Math.PI/180,true);cc.stroke();cc.fillStyle="#172033";cc.font="bold 16px sans-serif";cc.fillText("P",px+10,py-10);cc.fillStyle="#2563eb";cc.fillText("cosθ",(cx+px)/2-20,cy+25);cc.fillStyle="#dc2626";cc.fillText("sinθ",px+10,(cy+py)/2);cc.fillStyle="#64748b";cc.font="14px sans-serif";cc.fillText("1",cx+R-8,cy+18);cc.fillText("-1",cx-R-10,cy+18);cc.fillText("1",cx+7,cy-R+5);cc.fillText("-1",cx+7,cy+R+5)}
function drawGraph(deg){const W=graph.width,H=graph.height,L=52,R=18,T=28,B=42,xmin=-360,xmax=720,ymin=-1.25,ymax=1.25,X=x=>L+(x-xmin)/(xmax-xmin)*(W-L-R),Y=y=>T+(ymax-y)/(ymax-ymin)*(H-T-B);gc.clearRect(0,0,W,H);gc.strokeStyle="#dbe3ee";gc.lineWidth=1;for(let x=-360;x<=720;x+=90){gc.beginPath();gc.moveTo(X(x),T);gc.lineTo(X(x),H-B);gc.stroke();gc.fillStyle="#64748b";gc.font="12px sans-serif";gc.fillText(x+"°",X(x)-14,H-17)}for(let y=-1;y<=1;y+=.5){gc.beginPath();gc.moveTo(L,Y(y));gc.lineTo(W-R,Y(y));gc.stroke();gc.fillStyle="#64748b";gc.fillText(String(y),10,Y(y)+4)}gc.strokeStyle="#475569";gc.lineWidth=2;gc.beginPath();gc.moveTo(L,Y(0));gc.lineTo(W-R,Y(0));gc.stroke();
function curve(fn,color){gc.strokeStyle=color;gc.lineWidth=3;gc.beginPath();for(let p=0;p<=W-L-R;p++){const x=xmin+(xmax-xmin)*p/(W-L-R),y=fn(x*Math.PI/180);if(p===0)gc.moveTo(X(x),Y(y));else gc.lineTo(X(x),Y(y))}gc.stroke()}curve(Math.sin,"#dc2626");curve(Math.cos,"#2563eb");const s=Math.sin(deg*Math.PI/180),c=Math.cos(deg*Math.PI/180);gc.strokeStyle="#7c3aed";gc.lineWidth=2;gc.setLineDash([6,5]);gc.beginPath();gc.moveTo(X(deg),T);gc.lineTo(X(deg),H-B);gc.stroke();gc.setLineDash([]);gc.fillStyle="#dc2626";gc.beginPath();gc.arc(X(deg),Y(s),7,0,Math.PI*2);gc.fill();gc.fillStyle="#2563eb";gc.beginPath();gc.arc(X(deg),Y(c),7,0,Math.PI*2);gc.fill();gc.font="bold 15px sans-serif";gc.fillStyle="#dc2626";gc.fillText("sinθ",W-85,42);gc.fillStyle="#2563eb";gc.fillText("cosθ",W-85,64)}
function update(){const d=Number(angle.value),rad=d*Math.PI/180,s=Math.sin(rad),c=Math.cos(rad),norm=normalize(d),exact=exactTable[norm],undefinedTan=Math.abs(c)<1e-10,t=undefinedTan?NaN:Math.tan(rad);angleText.textContent=d+"°（0°〜360°では "+norm+"°）";drawCircle(d);drawGraph(d);const tanText=undefinedTan?"定義できません":display(t,exact?.tan);readout.innerHTML="単位円上の点 P = (<b class='cos'>"+display(c,exact?.cos)+"</b>, <b class='sin'>"+display(s,exact?.sin)+"</b>)<div class='value-grid'><div class='value cos'>cos"+d+"° = "+display(c,exact?.cos)+"</div><div class='value sin'>sin"+d+"° = "+display(s,exact?.sin)+"</div><div class='value tan'>tan"+d+"° = "+tanText+"</div></div><div class='hint' style='margin-top:8px'>"+(exact?"正規化した角度が代表角なので、厳密値を表示しています。":"厳密値は代表角に一致したときだけ表示されます。")+"</div>"}
angle.addEventListener("input",update);document.querySelectorAll("[data-a]").forEach(b=>b.addEventListener("click",()=>{angle.value=b.dataset.a;update()}));let dragging=false;function drag(e){const r=circle.getBoundingClientRect(),sx=circle.width/r.width,sy=circle.height/r.height,x=(e.clientX-r.left)*sx-circle.width/2,y=circle.height/2-(e.clientY-r.top)*sy;let d=Math.atan2(y,x)*180/Math.PI;if(d<0)d+=360;angle.value=Math.round(d);update()}circle.addEventListener("pointerdown",e=>{dragging=true;circle.setPointerCapture(e.pointerId);drag(e)});circle.addEventListener("pointermove",e=>{if(dragging)drag(e)});circle.addEventListener("pointerup",()=>dragging=false);update();
</script></body></html>
