<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>データの分析―相関と回帰直線</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:15px;background:#f8fafc;color:#172033;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:1080px;margin:auto;display:grid;gap:12px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:18px;padding:15px;box-shadow:0 10px 26px rgba(15,23,42,.06)}h1{margin:0 0 7px;font-size:clamp(22px,3vw,31px)}p{margin:0;line-height:1.7;color:#475569}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar button{padding:9px 12px;border:1px solid #bfdbfe;border-radius:9px;background:#eff6ff;color:#1d4ed8;font-weight:750}.layout{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(270px,.65fr);gap:12px}.canvas-wrap{height:clamp(420px,65vh,680px);border:1px solid #dbe3ee;border-radius:14px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}.info{display:grid;gap:9px}.box{padding:11px;border:1px solid #dbe3ee;border-radius:11px;background:#f8fafc;line-height:1.65}.metric{font-size:21px;font-weight:800;color:#2563eb}.warn{background:#fef3c7;color:#92400e}.explain{background:#eff6ff;color:#1e3a8a}@media(max-width:800px){.layout{grid-template-columns:1fr}.canvas-wrap{height:min(60vh,540px)}}@media(max-width:520px){body{padding:8px}.card{padding:12px}}
</style></head><body><main class="app"><section class="card"><h1>散布図・相関係数・回帰直線</h1><p>点をドラッグして外れ値を作り、相関係数rと最小二乗回帰直線がどう変わるか観察します。空白をクリックすると点を追加、点を右クリックすると削除できます。</p></section><section class="card toolbar"><button id="reset">初期データに戻す</button><button id="clear">すべて消す</button><span id="count"></span></section><section class="card layout"><div class="canvas-wrap"><canvas id="cv"></canvas></div><div class="info"><div class="box"><div>相関係数 r</div><div class="metric" id="rValue">—</div></div><div class="box"><div>回帰直線</div><div class="metric" id="lineValue">—</div></div><div class="box" id="status"></div><div class="box explain"><b>相関係数</b>は直線的な関係の強さと向きを−1〜1で表します。<br><b>回帰直線</b>は、各点から直線までの縦方向のずれの二乗和を最小にする直線です。外れ値は両者を大きく変えることがあります。</div></div></section></main>
<script>
"use strict";
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),initial=[{x:1.2,y:1.8},{x:2.2,y:2.6},{x:3.1,y:3.8},{x:4.0,y:4.1},{x:5.1,y:5.5},{x:6.2,y:6.0},{x:7.3,y:7.5}],margin={l:48,r:20,t:20,b:42};let points=initial.map(p=>({...p})),drag=-1,raf=0;
function stats(){const n=points.length;if(n<2)return null;const mx=points.reduce((s,p)=>s+p.x,0)/n,my=points.reduce((s,p)=>s+p.y,0)/n;let sxx=0,syy=0,sxy=0;for(const p of points){const dx=p.x-mx,dy=p.y-my;sxx+=dx*dx;syy+=dy*dy;sxy+=dx*dy}const slope=sxx<1e-12?null:sxy/sxx,intercept=slope===null?null:my-slope*mx,r=sxx<1e-12||syy<1e-12?null:sxy/Math.sqrt(sxx*syy);return{mx,my,slope,intercept,r}}
function update(){const st=stats();document.getElementById("count").textContent="点の数："+points.length;if(!st){document.getElementById("rValue").textContent="—";document.getElementById("lineValue").textContent="—";document.getElementById("status").className="box warn";document.getElementById("status").textContent="点を2つ以上配置してください。"}else{document.getElementById("rValue").textContent=st.r===null?"定義できません":st.r.toFixed(4);document.getElementById("lineValue").textContent=st.slope===null?"xの値がすべて同じ":("y = "+st.slope.toFixed(3)+"x "+(st.intercept>=0?"+ ":"− ")+Math.abs(st.intercept).toFixed(3));document.getElementById("status").className="box";document.getElementById("status").textContent="点を1つ大きく離して、rと回帰直線の変化を比較してみましょう。"}draw()}
function resize(){const b=cv.getBoundingClientRect(),q=Math.min(devicePixelRatio||1,2);cv.width=Math.round(b.width*q);cv.height=Math.round(b.height*q);ctx.setTransform(q,0,0,q,0,0);draw()}
function transforms(){const b=cv.getBoundingClientRect(),W=b.width,H=b.height,X=x=>margin.l+x/10*(W-margin.l-margin.r),Y=y=>H-margin.b-y/10*(H-margin.t-margin.b),invX=x=>(x-margin.l)/(W-margin.l-margin.r)*10,invY=y=>(H-margin.b-y)/(H-margin.t-margin.b)*10;return{W,H,X,Y,invX,invY}}
function draw(){const {W,H,X,Y}=transforms();if(!W)return;ctx.clearRect(0,0,W,H);ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.strokeStyle="#e2e8f0";ctx.lineWidth=1;ctx.font="12px sans-serif";ctx.fillStyle="#64748b";for(let k=0;k<=10;k++){ctx.beginPath();ctx.moveTo(X(k),margin.t);ctx.lineTo(X(k),H-margin.b);ctx.stroke();ctx.beginPath();ctx.moveTo(margin.l,Y(k));ctx.lineTo(W-margin.r,Y(k));ctx.stroke();if(k%2===0){ctx.fillText(String(k),X(k)-3,H-18);ctx.fillText(String(k),14,Y(k)+4)}}ctx.strokeStyle="#475569";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(margin.l,H-margin.b);ctx.lineTo(W-margin.r,H-margin.b);ctx.stroke();ctx.beginPath();ctx.moveTo(margin.l,margin.t);ctx.lineTo(margin.l,H-margin.b);ctx.stroke();const st=stats();if(st&&st.slope!==null){ctx.strokeStyle="#dc2626";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(X(0),Y(st.intercept));ctx.lineTo(X(10),Y(st.slope*10+st.intercept));ctx.stroke()}points.forEach((p,i)=>{ctx.fillStyle=i===drag?"#7c3aed":"#2563eb";ctx.beginPath();ctx.arc(X(p.x),Y(p.y),8,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke()})}
function local(e){const b=cv.getBoundingClientRect(),t=transforms();return{sx:e.clientX-b.left,sy:e.clientY-b.top,x:Math.max(0,Math.min(10,t.invX(e.clientX-b.left))),y:Math.max(0,Math.min(10,t.invY(e.clientY-b.top))),X:t.X,Y:t.Y}}
function nearest(p,max=14){let best=-1,d=max;points.forEach((q,i)=>{const z=Math.hypot(p.sx-p.X(q.x),p.sy-p.Y(q.y));if(z<d){d=z;best=i}});return best}
cv.addEventListener("pointerdown",e=>{if(e.button!==0)return;const p=local(e),i=nearest(p);if(i>=0){drag=i}else{points.push({x:p.x,y:p.y});drag=points.length-1}cv.setPointerCapture(e.pointerId);update()});cv.addEventListener("pointermove",e=>{if(drag<0)return;const p=local(e);points[drag]={x:p.x,y:p.y};update()});cv.addEventListener("pointerup",()=>{drag=-1;draw()});cv.addEventListener("contextmenu",e=>{e.preventDefault();const p=local(e),i=nearest(p,18);if(i>=0){points.splice(i,1);drag=-1;update()}});document.getElementById("reset").onclick=()=>{points=initial.map(p=>({...p}));update()};document.getElementById("clear").onclick=()=>{points=[];update()};new ResizeObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(resize)}).observe(cv.parentElement);update();resize();
</script></body></html>
