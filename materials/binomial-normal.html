<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>二項分布と正規分布近似</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:15px;background:#f8fafc;color:#172033;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:1120px;margin:auto;display:grid;gap:12px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:18px;padding:15px;box-shadow:0 10px 26px rgba(15,23,42,.06)}h1{margin:0 0 7px;font-size:clamp(22px,3vw,31px)}p{margin:0;line-height:1.7;color:#475569}.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}.control label{display:flex;justify-content:space-between;font-weight:750}.control input{width:100%;accent-color:#2563eb}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.metric{padding:10px;border:1px solid #dbe3ee;border-radius:11px;background:#f8fafc}.metric b{display:block;margin-top:4px;font-size:20px;color:#2563eb}.canvas-wrap{height:clamp(420px,64vh,680px);border:1px solid #dbe3ee;border-radius:14px;overflow:hidden}canvas{display:block;width:100%;height:100%}.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px;color:#475569;font-size:13px}.swatch{display:inline-block;width:18px;height:11px;margin-right:5px}.note{line-height:1.75;background:#eff6ff;color:#1e3a8a}.quality{font-weight:800}@media(max-width:750px){.controls{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}.canvas-wrap{height:min(58vh,540px)}}@media(max-width:460px){body{padding:8px}.metrics{grid-template-columns:1fr}}
</style></head><body><main class="app"><section class="card"><h1>二項分布と正規分布近似</h1><p>B(n,p)の棒グラフに、平均np・分散np(1−p)をもつ正規分布の密度曲線を重ねます。nを大きくし、pが0や1に近すぎないときに形が近づく様子を観察しましょう。</p></section><section class="card controls"><div class="control"><label>試行回数 n <output id="nv">30</output></label><input id="n" type="range" min="5" max="100" step="1" value="30"></div><div class="control"><label>成功確率 p <output id="pv">0.50</output></label><input id="p" type="range" min="0.10" max="0.90" step="0.05" value="0.50"></div></section><section class="metrics"><div class="metric">平均 np<b id="mean"></b></div><div class="metric">分散 np(1−p)<b id="variance"></b></div><div class="metric">標準偏差<b id="sd"></b></div><div class="metric">近似の目安<b class="quality" id="quality"></b></div></section><section class="card"><div class="legend"><span><i class="swatch" style="background:rgba(37,99,235,.55)"></i>二項分布P(X=k)</span><span><i class="swatch" style="height:3px;background:#dc2626"></i>正規分布の密度</span></div><div class="canvas-wrap"><canvas id="cv"></canvas></div></section><section class="card note"><b>なぜ近づくのか：</b>二項変数は、独立なベルヌーイ試行の和です。中心極限定理により、試行回数が増えると標準化した和の分布は正規分布へ近づきます。ただしnpとn(1−p)が小さいと左右に偏るため、近似はよくありません。棒の高さは確率質量、赤線は幅1に対応させた正規密度です。</section></main>
<script>
"use strict";
const nEl=document.getElementById("n"),pEl=document.getElementById("p"),cv=document.getElementById("cv"),ctx=cv.getContext("2d"),M={l:54,r:18,t:22,b:46};let raf=0;
function pmf(n,p){const q=1-p,a=new Array(n+1).fill(0);a[0]=Math.pow(q,n);for(let k=0;k<n;k++)a[k+1]=a[k]*(n-k)/(k+1)*p/q;const sum=a.reduce((s,v)=>s+v,0);return a.map(v=>v/sum)}function density(x,mu,sigma){return Math.exp(-.5*((x-mu)/sigma)**2)/(sigma*Math.sqrt(2*Math.PI))}
function update(){const n=+nEl.value,p=+pEl.value,mu=n*p,v=n*p*(1-p),sd=Math.sqrt(v);document.getElementById("nv").textContent=n;document.getElementById("pv").textContent=p.toFixed(2);document.getElementById("mean").textContent=mu.toFixed(2);document.getElementById("variance").textContent=v.toFixed(2);document.getElementById("sd").textContent=sd.toFixed(2);const minExpected=Math.min(mu,n*(1-p));document.getElementById("quality").textContent=minExpected>=10?"良好":minExpected>=5?"おおむね可":"注意";document.getElementById("quality").style.color=minExpected>=10?"#047857":minExpected>=5?"#b45309":"#dc2626";draw()}
function resize(){const b=cv.getBoundingClientRect(),q=Math.min(devicePixelRatio||1,2);cv.width=Math.round(b.width*q);cv.height=Math.round(b.height*q);ctx.setTransform(q,0,0,q,0,0);draw()}
function draw(){const b=cv.getBoundingClientRect(),W=b.width,H=b.height;if(!W)return;const n=+nEl.value,p=+pEl.value,mu=n*p,sigma=Math.sqrt(n*p*(1-p)),probs=pmf(n,p),normal=Array.from({length:n+1},(_,k)=>density(k,mu,sigma)),maxY=Math.max(...probs,...normal)*1.14,X=x=>M.l+(x+.5)/(n+1)*(W-M.l-M.r),Y=y=>H-M.b-y/maxY*(H-M.t-M.b),barW=(W-M.l-M.r)/(n+1)*.82;ctx.clearRect(0,0,W,H);ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.strokeStyle="#e2e8f0";ctx.lineWidth=1;for(let j=0;j<=5;j++){const y=maxY*j/5;ctx.beginPath();ctx.moveTo(M.l,Y(y));ctx.lineTo(W-M.r,Y(y));ctx.stroke();ctx.fillStyle="#64748b";ctx.font="11px sans-serif";ctx.fillText(y.toFixed(3),5,Y(y)+4)}const tick=Math.max(1,Math.ceil(n/10));for(let k=0;k<=n;k+=tick){ctx.fillStyle="#64748b";ctx.fillText(String(k),X(k)-4,H-22)}ctx.strokeStyle="#475569";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(M.l,H-M.b);ctx.lineTo(W-M.r,H-M.b);ctx.stroke();ctx.beginPath();ctx.moveTo(M.l,M.t);ctx.lineTo(M.l,H-M.b);ctx.stroke();probs.forEach((v,k)=>{ctx.fillStyle="rgba(37,99,235,.55)";ctx.strokeStyle="#2563eb";ctx.lineWidth=1;ctx.fillRect(X(k)-barW/2,Y(v),barW,H-M.b-Y(v));ctx.strokeRect(X(k)-barW/2,Y(v),barW,H-M.b-Y(v))});ctx.strokeStyle="#dc2626";ctx.lineWidth=3;ctx.beginPath();const steps=Math.max(500,n*12);for(let i=0;i<=steps;i++){const x=-.5+(n+1)*i/steps,y=density(x,mu,sigma);if(i===0)ctx.moveTo(X(x),Y(y));else ctx.lineTo(X(x),Y(y))}ctx.stroke();ctx.strokeStyle="#7c3aed";ctx.setLineDash([6,5]);ctx.beginPath();ctx.moveTo(X(mu),M.t);ctx.lineTo(X(mu),H-M.b);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle="#7c3aed";ctx.font="bold 12px sans-serif";ctx.fillText("平均 "+mu.toFixed(1),Math.min(W-90,X(mu)+5),M.t+14)}
nEl.addEventListener("input",update);pEl.addEventListener("input",update);new ResizeObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(resize)}).observe(cv.parentElement);update();resize();
</script></body></html>
