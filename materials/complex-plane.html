<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>複素数平面―積・商と回転</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f8fafc;color:#172033;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:1120px;margin:auto;display:grid;gap:12px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:18px;padding:16px;box-shadow:0 10px 26px rgba(15,23,42,.06)}h1{margin:0 0 7px;font-size:clamp(22px,3vw,31px)}p{margin:0;line-height:1.7;color:#475569}.controls{display:grid;grid-template-columns:repeat(2,minmax(240px,1fr));gap:12px}.group{padding:12px;border-radius:13px;background:#f1f5f9}.group h2{margin:0 0 8px;font-size:16px}.row{display:grid;grid-template-columns:75px 1fr 52px;gap:8px;align-items:center;margin:7px 0}.row input{width:100%;accent-color:#2563eb}.value{font-variant-numeric:tabular-nums;font-weight:800;color:#2563eb;text-align:right}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.toolbar button,.toolbar select{padding:8px 11px;border-radius:9px;border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;font-weight:750}.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(290px,.75fr);gap:12px;align-items:start}.canvas-wrap{height:clamp(390px,62vh,650px);border:1px solid #dbe3ee;border-radius:14px;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}.readouts{display:grid;gap:9px}.box{padding:11px;border-radius:11px;border:1px solid #dbe3ee;background:#f8fafc;line-height:1.6}.z1{color:#2563eb}.z2{color:#dc2626}.result{color:#7c3aed}.formula{background:#eff6ff;color:#1e3a8a}.warn{background:#fef3c7;color:#92400e}@media(max-width:800px){.controls,.layout{grid-template-columns:1fr}.canvas-wrap{height:min(58vh,520px)}}@media(max-width:520px){body{padding:8px}.card{padding:12px}.row{grid-template-columns:65px 1fr 46px}}
</style></head>
<body><main class="app"><section class="card"><h1>複素数の積・商は回転と拡大縮小</h1><p>ガウス平面上で z₁・z₂を動かし、積では絶対値が掛け算、偏角が足し算になることを確かめます。点はドラッグでも動かせます。</p></section>
<section class="card controls"><div class="group"><h2 class="z1">z₁ = a+bi</h2><div class="row"><label>実部 a</label><input id="a1" type="range" min="-3" max="3" step="0.1" value="2"><output class="value" id="a1v">2.0</output></div><div class="row"><label>虚部 b</label><input id="b1" type="range" min="-3" max="3" step="0.1" value="1"><output class="value" id="b1v">1.0</output></div></div>
<div class="group"><h2 class="z2">z₂ = c+di</h2><div class="row"><label>実部 c</label><input id="a2" type="range" min="-3" max="3" step="0.1" value="1"><output class="value" id="a2v">1.0</output></div><div class="row"><label>虚部 d</label><input id="b2" type="range" min="-3" max="3" step="0.1" value="1"><output class="value" id="b2v">1.0</output></div><div class="toolbar"><button id="presetI">z₂=i</button><button id="presetMinusI">z₂=−i</button><select id="operation"><option value="mul">積 z₁z₂</option><option value="div">商 z₁/z₂</option></select></div></div></section>
<section class="card layout"><div class="canvas-wrap"><canvas id="cv"></canvas></div><div class="readouts"><div class="box z1" id="z1Info"></div><div class="box z2" id="z2Info"></div><div class="box result" id="resultInfo"></div><div class="box formula" id="ruleInfo"></div><div class="box warn" id="warning" hidden></div></div></section></main>
<script>
"use strict";
const ids=["a1","b1","a2","b2"],el=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)])),cv=document.getElementById("cv"),ctx=cv.getContext("2d"),operation=document.getElementById("operation"),warning=document.getElementById("warning");let ratio=1,dragging=null,raf=0;
function complex(re,im){return{re,im}}function mul(z,w){return complex(z.re*w.re-z.im*w.im,z.re*w.im+z.im*w.re)}function div(z,w){const q=w.re*w.re+w.im*w.im;return q<1e-10?null:complex((z.re*w.re+z.im*w.im)/q,(z.im*w.re-z.re*w.im)/q)}function abs(z){return Math.hypot(z.re,z.im)}function arg(z){return Math.atan2(z.im,z.re)*180/Math.PI}function fmt(v){return Math.abs(v)<.0005?"0":v.toFixed(3)}function ztext(z){const sign=z.im<0?" − ":" + ";return fmt(z.re)+sign+fmt(Math.abs(z.im))+"i"}function angleText(v){return Math.abs(v)<.0005?"0°":v.toFixed(1)+"°"}
function state(){return{z1:complex(+el.a1.value,+el.b1.value),z2:complex(+el.a2.value,+el.b2.value)}}
function update(){const {z1,z2}=state(),isMul=operation.value==="mul",r=isMul?mul(z1,z2):div(z1,z2);ids.forEach(id=>document.getElementById(id+"v").textContent=(+el[id].value).toFixed(1));document.getElementById("z1Info").innerHTML="<b>z₁ = "+ztext(z1)+"</b><br>|z₁| = "+fmt(abs(z1))+"<br>arg z₁ = "+angleText(arg(z1));document.getElementById("z2Info").innerHTML="<b>z₂ = "+ztext(z2)+"</b><br>|z₂| = "+fmt(abs(z2))+"<br>arg z₂ = "+angleText(arg(z2));if(!r){warning.hidden=false;warning.textContent="z₂=0なので、商 z₁/z₂ は定義できません。";document.getElementById("resultInfo").textContent="商は定義できません";document.getElementById("ruleInfo").textContent="除数z₂は0でない必要があります。"}else{warning.hidden=true;document.getElementById("resultInfo").innerHTML="<b>"+(isMul?"z₁z₂":"z₁/z₂")+" = "+ztext(r)+"</b><br>絶対値 = "+fmt(abs(r))+"<br>偏角 = "+angleText(arg(r));document.getElementById("ruleInfo").innerHTML=isMul?"<b>|z₁z₂| = |z₁||z₂|</b><br>"+fmt(abs(r))+" = "+fmt(abs(z1))+" × "+fmt(abs(z2))+"<br><b>arg(z₁z₂) = arg z₁ + arg z₂</b><br>（角度は360°の違いを同じ向きとみなします）":"<b>|z₁/z₂| = |z₁|/|z₂|</b><br>"+fmt(abs(r))+" = "+fmt(abs(z1))+" ÷ "+fmt(abs(z2))+"<br><b>arg(z₁/z₂) = arg z₁ − arg z₂</b>"}draw()}
function resize(){const b=cv.getBoundingClientRect();ratio=Math.min(devicePixelRatio||1,2);cv.width=Math.max(1,Math.round(b.width*ratio));cv.height=Math.max(1,Math.round(b.height*ratio));ctx.setTransform(ratio,0,0,ratio,0,0);draw()}
function draw(){const b=cv.getBoundingClientRect(),W=b.width,H=b.height;if(!W)return;const {z1,z2}=state(),r=operation.value==="mul"?mul(z1,z2):div(z1,z2),max=Math.max(4,Math.ceil(abs(z1)),Math.ceil(abs(z2)),r?Math.ceil(abs(r)):0),scale=.43*Math.min(W,H)/max,cx=W/2,cy=H/2,X=x=>cx+x*scale,Y=y=>cy-y*scale;ctx.clearRect(0,0,W,H);ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.strokeStyle="#e2e8f0";ctx.lineWidth=1;for(let k=-max;k<=max;k++){ctx.beginPath();ctx.moveTo(X(k),0);ctx.lineTo(X(k),H);ctx.stroke();ctx.beginPath();ctx.moveTo(0,Y(k));ctx.lineTo(W,Y(k));ctx.stroke()}ctx.strokeStyle="#475569";ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(W,cy);ctx.stroke();ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,H);ctx.stroke();ctx.fillStyle="#475569";ctx.font="13px sans-serif";ctx.fillText("実軸",W-38,cy-8);ctx.fillText("虚軸",cx+7,15);
function vector(z,color,label){ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(X(z.re),Y(z.im));ctx.stroke();const ang=Math.atan2(Y(z.im)-cy,X(z.re)-cx);ctx.beginPath();ctx.moveTo(X(z.re),Y(z.im));ctx.lineTo(X(z.re)-13*Math.cos(ang-.45),Y(z.im)-13*Math.sin(ang-.45));ctx.lineTo(X(z.re)-13*Math.cos(ang+.45),Y(z.im)-13*Math.sin(ang+.45));ctx.closePath();ctx.fill();ctx.beginPath();ctx.arc(X(z.re),Y(z.im),7,0,Math.PI*2);ctx.fill();ctx.font="bold 15px sans-serif";ctx.fillText(label,X(z.re)+9,Y(z.im)-9)}vector(z1,"#2563eb","z₁");vector(z2,"#dc2626","z₂");if(r)vector(r,"#7c3aed",operation.value==="mul"?"z₁z₂":"z₁/z₂")}
function pointer(e){const b=cv.getBoundingClientRect(),W=b.width,H=b.height,{z1,z2}=state(),r=operation.value==="mul"?mul(z1,z2):div(z1,z2),max=Math.max(4,Math.ceil(abs(z1)),Math.ceil(abs(z2)),r?Math.ceil(abs(r)):0),scale=.43*Math.min(W,H)/max,cx=W/2,cy=H/2;return{x:(e.clientX-b.left-cx)/scale,y:(cy-(e.clientY-b.top))/scale,screen:{x:e.clientX-b.left,y:e.clientY-b.top},map:z=>({x:cx+z.re*scale,y:cy-z.im*scale})}}
cv.addEventListener("pointerdown",e=>{const p=pointer(e),{z1,z2}=state(),p1=p.map(z1),p2=p.map(z2);dragging=Math.hypot(p.screen.x-p1.x,p.screen.y-p1.y)<=Math.hypot(p.screen.x-p2.x,p.screen.y-p2.y)?"z1":"z2";cv.setPointerCapture(e.pointerId)});cv.addEventListener("pointermove",e=>{if(!dragging)return;const p=pointer(e),re=Math.max(-3,Math.min(3,Math.round(p.x*10)/10)),im=Math.max(-3,Math.min(3,Math.round(p.y*10)/10));if(dragging==="z1"){el.a1.value=re;el.b1.value=im}else{el.a2.value=re;el.b2.value=im}update()});cv.addEventListener("pointerup",()=>dragging=null);ids.forEach(id=>el[id].addEventListener("input",update));operation.addEventListener("change",update);document.getElementById("presetI").onclick=()=>{el.a2.value=0;el.b2.value=1;update()};document.getElementById("presetMinusI").onclick=()=>{el.a2.value=0;el.b2.value=-1;update()};new ResizeObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(resize)}).observe(cv.parentElement);update();resize();
</script></body></html>
