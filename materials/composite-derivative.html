<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合成関数の微分</title><style>body{font-family:system-ui;background:#f8fafc;color:#172033;margin:0;padding:24px}.app{max-width:800px;margin:auto;background:white;border:1px solid #dbe3ee;border-radius:18px;padding:22px}.s{padding:13px;border-radius:11px;background:#f1f5f9;margin:9px 0}.hide{filter:blur(6px);user-select:none}button{padding:10px 14px;border:0;border-radius:9px;background:#2563eb;color:white;font-weight:700}</style></head><body><div class="app"><h1>合成関数の微分を分解する</h1><p>例：<b>y=(3x²+1)¹²</b></p><div class="s">外側：u¹²</div><div class="s">内側：u=3x²+1</div><div class="s">外側の微分：<span id="h1" class="hide">12u¹¹</span></div><div class="s">内側の微分：<span id="h2" class="hide">6x</span></div><div class="s">答え：<span id="h3" class="hide">72x(3x²+1)¹¹</span></div><button id="n">次のヒント</button></div><script>const ids=["h1","h2","h3"];let i=0;n.onclick=()=>{if(i<3)document.getElementById(ids[i++]).classList.remove("hide")}</script></body></html>
