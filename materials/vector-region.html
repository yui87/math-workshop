<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>ベクトルの一次結合と領域</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:15px;background:#f8fafc;color:#172033;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.app{max-width:1100px;margin:auto;display:grid;gap:12px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:18px;padding:15px;box-shadow:0 10px 26px rgba(15,23,42,.06)}h1{margin:0 0 7px;font-size:clamp(22px,3vw,31px)}p{margin:0;line-height:1.7;color:#475569}.controls{display:grid;grid-template-columns:minmax(250px,.75fr) minmax(0,1.25fr);gap:12px;align-items:center}.mode select{width:100%;padding:10px;border:1px solid #bfdbfe;border-radius:10px;background:#eff6ff;color:#1e3a8a;font-weight:750}.sliders{display:grid;grid-template-columns:1fr 1fr;gap:12px}.slider label{display:flex;justify-content:space-between;font-weight:750}.slider input{width:100%;accent-color:#2563eb}.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.7fr);gap:12px}.canvas-wrap{height:clamp(400px,63vh,650px);border:1px solid #dbe3ee;border-radius:14px;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}.info{display:grid;gap:9px}.box{padding:11px;border:1px solid #dbe3ee;border-radius:11px;background:#f8fafc;line-height:1.65}.formula{background:#eff6ff;color:#1e3a8a}.a{color:#2563eb}.b{color:#dc2626}.p{color:#7c3aed}@media(max-width:800px){.controls,.layout{grid-template-columns:1fr}.canvas-wrap{height:min(58vh,520px)}}@media(max-width:550px){body{padding:8px}.sliders{grid-template-columns:1fr}}
</style></head><body><main class="app"><section class="card"><h1>ベクトルの一次結合と領域</h1><p>点Pを <b>p=s·a+t·b</b> と表すと、係数s,tの条件によって、Pが動ける範囲は直線・三角形・平行四辺形になります。ベクトルa,bの先端はドラッグできます。</p></section>
<section class="card controls"><div class="mode"><select id="mode"><option value="line">s+t=1（直線）</option><option value="triangle">s+t≤1, s≥0, t≥0（三角形）</option><option value="para">0≤s≤1, 0≤t≤1（平行四辺形）</option></select></div><div class="sliders"><div class="slider"><label>s <output id="sv">0.40</output></label><input id="s" type="range" min="-1.5" max="2.5" step="0.01" value="0.4"></div><div class="slider"><label>t <output id="tv">0.60</output></label><input id="t" type="range" min="-1.5" max="2.5" step="0.01" value="0.6"></div></div></section>
<section class="card layout"><div class="canvas-wrap"><canvas id="cv"></canvas></div><div class="info"><div class="box"><b class="a" id="ainfo"></b><br><b class="b" id="binfo"></b></div><div class="box p" id="pinfo"></div><div class="box formula" id="explain"></div><div class="box">青の矢印がa、赤がb、紫が現在のpです。色の付いた図形が、条件を満たすPの全領域です。</div></div></section></main>
<script>
"use strict";
const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),mode=document.getElementById("mode"),sEl=document.getElementById("s"),tEl=document.getElementById("t"),sv=document.getElementById("sv"),tv=document.getElementById("tv");let a={x:4,y:1},b={x:1,y:3},dragging=null,raf=0;
function setRanges(){if(mode.value==="line"){sEl.min=-1.5;sEl.max=2.5;tEl.min=-1.5;tEl.max=2.5;tEl.disabled=true;tEl.value=(1-Number(sEl.value)).toFixed(2)}else{sEl.min=0;sEl.max=1;tEl.min=0;tEl.max=1;tEl.disabled=false;sEl.value=Math.max(0,Math.min(1,+sEl.value));tEl.value=Math.max(0,Math.min(1,+tEl.value));if(mode.value==="triangle"&&+sEl.value + +tEl.value>1)tEl.value=(1-+sEl.value).toFixed(2)}}
function enforce(changed){if(mode.value==="line"){tEl.value=(1-Number(sEl.value)).toFixed(2)}else if(mode.value==="triangle"&&+sEl.value + +tEl.value>1){if(changed==="s")tEl.value=Math.max(0,1-+sEl.value).toFixed(2);else sEl.value=Math.max(0,1-+tEl.value).toFixed(2)}}
function update(){enforce();const s=+sEl.value,t=+tEl.value,p={x:s*a.x+t*b.x,y:s*a.y+t*b.y};sv.textContent=s.toFixed(2);tv.textContent=t.toFixed(2);document.getElementById("ainfo").textContent="a = ("+a.x.toFixed(1)+", "+a.y.toFixed(1)+")";document.getElementById("binfo").textContent="b = ("+b.x.toFixed(1)+", "+b.y.toFixed(1)+")";document.getElementById("pinfo").innerHTML="<b>p = s·a+t·b = ("+p.x.toFixed(2)+", "+p.y.toFixed(2)+")</b><br>s="+s.toFixed(2)+", t="+t.toFixed(2);document.getElementById("explain").innerHTML=mode.value==="line"?"<b>s+t=1なら p=s·a+(1−s)·b=b+s(a−b)</b><br>sを実数全体で動かすと、bを通り方向ベクトルa−bをもつ直線になります。":mode.value==="triangle"?"<b>s,t≥0 かつ s+t≤1</b><br>pは原点O、a、bの凸結合になり、三角形Oabの内部と境界を動きます。":"<b>0≤s,t≤1</b><br>a方向とb方向へ独立に0〜1倍動けるため、O,a,b,a+bを頂点とする平行四辺形になります。";draw()}
function resize(){const r=cv.getBoundingClientRect(),q=Math.min(devicePixelRatio||1,2);cv.width=Math.round(r.width*q);cv.height=Math.round(r.height*q);ctx.setTransform(q,0,0,q,0,0);draw()}
function draw(){const r=cv.getBoundingClientRect(),W=r.width,H=r.height;if(!W)return;const scale=.095*Math.min(W,H),cx=W*.43,cy=H*.58,X=x=>cx+x*scale,Y=y=>cy-y*scale,s=+sEl.value,t=+tEl.value,p={x:s*a.x+t*b.x,y:s*a.y+t*b.y};ctx.clearRect(0,0,W,H);ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);ctx.strokeStyle="#e2e8f0";ctx.lineWidth=1;for(let k=-7;k<=7;k++){ctx.beginPath();ctx.moveTo(X(k),0);ctx.lineTo(X(k),H);ctx.stroke();ctx.beginPath();ctx.moveTo(0,Y(k));ctx.lineTo(W,Y(k));ctx.stroke()}ctx.strokeStyle="#475569";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,cy);ctx.lineTo(W,cy);ctx.stroke();ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,H);ctx.stroke();
ctx.save();if(mode.value==="line"){ctx.strokeStyle="rgba(16,185,129,.75)";ctx.lineWidth=10;ctx.lineCap="round";const d={x:a.x-b.x,y:a.y-b.y};ctx.beginPath();ctx.moveTo(X(b.x-4*d.x),Y(b.y-4*d.y));ctx.lineTo(X(b.x+4*d.x),Y(b.y+4*d.y));ctx.stroke()}else{const pts=mode.value==="triangle"?[{x:0,y:0},a,b]:[{x:0,y:0},a,{x:a.x+b.x,y:a.y+b.y},b];ctx.fillStyle="rgba(16,185,129,.20)";ctx.strokeStyle="#059669";ctx.lineWidth=2.5;ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(X(q.x),Y(q.y)):ctx.moveTo(X(q.x),Y(q.y)));ctx.closePath();ctx.fill();ctx.stroke()}ctx.restore();
function arrow(v,color,label){ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(X(v.x),Y(v.y));ctx.stroke();const ang=Math.atan2(Y(v.y)-cy,X(v.x)-cx);ctx.beginPath();ctx.moveTo(X(v.x),Y(v.y));ctx.lineTo(X(v.x)-13*Math.cos(ang-.45),Y(v.y)-13*Math.sin(ang-.45));ctx.lineTo(X(v.x)-13*Math.cos(ang+.45),Y(v.y)-13*Math.sin(ang+.45));ctx.closePath();ctx.fill();ctx.beginPath();ctx.arc(X(v.x),Y(v.y),7,0,Math.PI*2);ctx.fill();ctx.font="bold 15px sans-serif";ctx.fillText(label,X(v.x)+9,Y(v.y)-9)}arrow(a,"#2563eb","a");arrow(b,"#dc2626","b");arrow(p,"#7c3aed","P");ctx.fillStyle="#172033";ctx.font="13px sans-serif";ctx.fillText("O",cx+6,cy+16)}
function canvasPoint(e){const r=cv.getBoundingClientRect(),W=r.width,H=r.height,scale=.095*Math.min(W,H),cx=W*.43,cy=H*.58;return{x:(e.clientX-r.left-cx)/scale,y:(cy-(e.clientY-r.top))/scale,screen:{x:e.clientX-r.left,y:e.clientY-r.top},map:v=>({x:cx+v.x*scale,y:cy-v.y*scale})}}
cv.addEventListener("pointerdown",e=>{const p=canvasPoint(e),pa=p.map(a),pb=p.map(b);dragging=Math.hypot(p.screen.x-pa.x,p.screen.y-pa.y)<=Math.hypot(p.screen.x-pb.x,p.screen.y-pb.y)?"a":"b";cv.setPointerCapture(e.pointerId)});cv.addEventListener("pointermove",e=>{if(!dragging)return;const p=canvasPoint(e),v={x:Math.max(-5,Math.min(5,Math.round(p.x*10)/10)),y:Math.max(-5,Math.min(5,Math.round(p.y*10)/10))};if(dragging==="a")a=v;else b=v;update()});cv.addEventListener("pointerup",()=>dragging=null);mode.addEventListener("change",()=>{setRanges();update()});sEl.addEventListener("input",()=>{enforce("s");update()});tEl.addEventListener("input",()=>{enforce("t");update()});new ResizeObserver(()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(resize)}).observe(cv.parentElement);setRanges();update();resize();
</script></body></html>
